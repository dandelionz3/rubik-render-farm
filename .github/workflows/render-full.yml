name: render-full

# Full run film Rubik Cat — 3.660 frame total (20 job paralel).
# Dipicu manual dari tab Actions. Repo harus PUBLIK supaya menit Actions gratis.
#
# Frame 1-120 film 16:9 SUDAH selesai di uji (run 44389889579, terverifikasi)
# jadi job film16 di sini mulai dari frame 121. Total baru: 3.540 frame.
#   film 16:9  121-1500 (1.380 frame, 8 job)
#   film 9:16    1-1500 (1.500 frame, 8 job)
#   intro 16:9   1-330  (330 frame, 2 job)
#   intro 9:16   1-330  (330 frame, 2 job)
#
# Upload: tiap job zip frame-nya (satu zip per chunk, ~110 MB — jauh di
# bawah batas 2 GB per file release) lalu upload sebagai release asset ke
# release "full-run-20261119" pakai `gh release upload` dengan GITHUB_TOKEN
# bawaan runner (permissions: contents: write). JANGAN pakai artifact —
# total ~2,2 GB melebihi batas gratis 500 MB.
# Release-nya DIBUAT DULU dari luar (sebelum trigger) supaya 20 job tidak
# berlomba membuat release yang sama:
#   gh release create full-run-20261119 --title "Full run 3.660 frame" \
#     --notes "Render penuh film Rubik Cat, 20 chunk paralel."
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # film 16:9 — plan.json, 960x540, lensk 1.00, toff 0 (frame 121-1500)
          - name: film16-a
            plan: pipeline/plan.json
            res_x: 960
            res_y: 540
            lensk: "1.00"
            toff: 0
            start: 121
            end: 293
          - name: film16-b
            plan: pipeline/plan.json
            res_x: 960
            res_y: 540
            lensk: "1.00"
            toff: 0
            start: 294
            end: 466
          - name: film16-c
            plan: pipeline/plan.json
            res_x: 960
            res_y: 540
            lensk: "1.00"
            toff: 0
            start: 467
            end: 639
          - name: film16-d
            plan: pipeline/plan.json
            res_x: 960
            res_y: 540
            lensk: "1.00"
            toff: 0
            start: 640
            end: 812
          - name: film16-e
            plan: pipeline/plan.json
            res_x: 960
            res_y: 540
            lensk: "1.00"
            toff: 0
            start: 813
            end: 985
          - name: film16-f
            plan: pipeline/plan.json
            res_x: 960
            res_y: 540
            lensk: "1.00"
            toff: 0
            start: 986
            end: 1158
          - name: film16-g
            plan: pipeline/plan.json
            res_x: 960
            res_y: 540
            lensk: "1.00"
            toff: 0
            start: 1159
            end: 1331
          - name: film16-h
            plan: pipeline/plan.json
            res_x: 960
            res_y: 540
            lensk: "1.00"
            toff: 0
            start: 1332
            end: 1500
          # film 9:16 — plan.json, 540x960, lensk 0.62, toff 0 (frame 1-1500)
          - name: film9-a
            plan: pipeline/plan.json
            res_x: 540
            res_y: 960
            lensk: "0.62"
            toff: 0
            start: 1
            end: 188
          - name: film9-b
            plan: pipeline/plan.json
            res_x: 540
            res_y: 960
            lensk: "0.62"
            toff: 0
            start: 189
            end: 376
          - name: film9-c
            plan: pipeline/plan.json
            res_x: 540
            res_y: 960
            lensk: "0.62"
            toff: 0
            start: 377
            end: 564
          - name: film9-d
            plan: pipeline/plan.json
            res_x: 540
            res_y: 960
            lensk: "0.62"
            toff: 0
            start: 565
            end: 752
          - name: film9-e
            plan: pipeline/plan.json
            res_x: 540
            res_y: 960
            lensk: "0.62"
            toff: 0
            start: 753
            end: 940
          - name: film9-f
            plan: pipeline/plan.json
            res_x: 540
            res_y: 960
            lensk: "0.62"
            toff: 0
            start: 941
            end: 1128
          - name: film9-g
            plan: pipeline/plan.json
            res_x: 540
            res_y: 960
            lensk: "0.62"
            toff: 0
            start: 1129
            end: 1316
          - name: film9-h
            plan: pipeline/plan.json
            res_x: 540
            res_y: 960
            lensk: "0.62"
            toff: 0
            start: 1317
            end: 1500
          # intro 16:9 — plan_intro.json, 960x540, lensk 1.00, toff -330
          - name: intro16-a
            plan: pipeline/plan_intro.json
            res_x: 960
            res_y: 540
            lensk: "1.00"
            toff: -330
            start: 1
            end: 165
          - name: intro16-b
            plan: pipeline/plan_intro.json
            res_x: 960
            res_y: 540
            lensk: "1.00"
            toff: -330
            start: 166
            end: 330
          # intro 9:16 — plan_intro.json, 540x960, lensk 0.62, toff -330
          - name: intro9-a
            plan: pipeline/plan_intro.json
            res_x: 540
            res_y: 960
            lensk: "0.62"
            toff: -330
            start: 1
            end: 165
          - name: intro9-b
            plan: pipeline/plan_intro.json
            res_x: 540
            res_y: 960
            lensk: "0.62"
            toff: -330
            start: 166
            end: 330
    env:
      FS_SAMPLES: "8"
      FS_RAY: "0"
      FS_VOL: "1"
      FS_VOLTILE: "16"
      FS_DOF: "1"
      FS_MB: "1"
      FS_SUB: "1"
      FS_BEVEL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Mesa/EGL + DejaVu font + zip
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libglx-mesa0 fonts-dejavu-core zip
          ldconfig -p | grep libEGL
          zip -v | head -2

      - name: Download Blender 4.5.3 LTS
        run: |
          curl -L -o blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz
          tar -xf blender.tar.xz
          ./blender-4.5.3-linux-x64/blender --version

      - name: Render frames
        run: |
          START=${{ matrix.start }}
          END=${{ matrix.end }}
          EXPECTED=$((END - START + 1))
          echo "Chunk ${{ matrix.name }}: frames $START-$END ($EXPECTED frames)"
          mkdir -p "$GITHUB_WORKSPACE/out"
          S=$(date +%s)
          # NOTE: keberhasilan dinilai dari FILE FRAME, bukan exit code Blender —
          # Mesa bisa segfault saat teardown SETELAH semua frame tersimpan.
          ./blender-4.5.3-linux-x64/blender -b --factory-startup \
            -P pipeline/animate_fast.py -- "$GITHUB_WORKSPACE/out" \
            --start $START --end $END --plan ${{ matrix.plan }} \
            --toff ${{ matrix.toff }} --res ${{ matrix.res_x }} ${{ matrix.res_y }} --lensk ${{ matrix.lensk }} || echo "blender exited rc=$?"
          E=$(date +%s)
          N=$(ls "$GITHUB_WORKSPACE/out"/f_*.png 2>/dev/null | wc -l)
          echo "CHUNK=${{ matrix.name }} FRAMES=$N/$EXPECTED SECS=$((E-S))" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$N" -lt "$EXPECTED" ]; then echo "FAIL: only $N/$EXPECTED frames rendered"; exit 1; fi

      - name: Zip + upload chunk to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHUNK: ${{ matrix.name }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
        run: |
          set -euo pipefail
          EXPECTED=$((END - START + 1))
          cd "$GITHUB_WORKSPACE/out"
          zip -q "../${CHUNK}.zip" f_*.png
          cd "$GITHUB_WORKSPACE"
          ZIPSIZE=$(stat -c%s "${CHUNK}.zip")
          ZIPSIZE_MB=$((ZIPSIZE / 1024 / 1024))
          INZIP=$(unzip -l "${CHUNK}.zip" | grep -c 'f_[0-9]*\.png')
          echo "CHUNK=$CHUNK ZIP=${ZIPSIZE_MB}MB FILES_IN_ZIP=$INZIP/$EXPECTED" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$ZIPSIZE" -ge 2147483648 ]; then echo "FAIL: zip >= 2 GB ($ZIPSIZE bytes)"; exit 1; fi
          if [ "$INZIP" -lt "$EXPECTED" ]; then echo "FAIL: zip holds $INZIP, expected $EXPECTED"; exit 1; fi
          # Release "full-run-20261119" dibuat dulu dari luar sebelum trigger,
          # jadi 20 job paralel tinggal upload (clobber = timpa kalau re-run).
          gh release upload full-run-20261119 "${CHUNK}.zip" --clobber
          gh release view full-run-20261119 --json assets \
            --jq ".assets[] | select(.name == \"${CHUNK}.zip\") | .name + \" \" + (.size|tostring)"

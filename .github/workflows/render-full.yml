name: render-full

# Full run film — 3.660 frame total (40 job paralel, ~92 frame/job).
# Dipicu manual dari tab Actions. Repo harus PUBLIK supaya menit Actions gratis.
#   film 16:9  1-1500 (1.500 frame, 16 job)
#   film 9:16  1-1500 (1.500 frame, 16 job)
#   intro 16:9 1-330  (330 frame, 4 job)
#   intro 9:16 1-330  (330 frame, 4 job)
#
# Setting cepat (terbukti di uji render-test-v2, commit e7d2e12):
#   - actions/cache untuk Blender 4.5.3 (cache-hit = download ter-skip,
#     dan mematikan mode gagal download tarball yang 2x menimpa full run
#     lama 20 job). Konkurensi terukur maks 18 job bersamaan.
#   Estimasi full run: ~1,2-1,8 jam wall-time, Rp0 (vs ~5 jam di 20 job).
#
# Upload: tiap job zip frame-nya (satu zip per chunk, ~110 MB — jauh di
# bawah batas 2 GB per file release) lalu upload sebagai release asset ke
# release yang namanya diisi di input `release_tag` pakai `gh release upload`
# dengan GITHUB_TOKEN bawaan runner (permissions: contents: write).
# JANGAN pakai artifact — total ~2,2 GB melebihi batas gratis 500 MB.
# Release-nya DIBUAT DULU dari luar (sebelum trigger) supaya 40 job tidak
# berlomba membuat release yang sama:
#   gh release create <tag-baru> --title "Full run <tanggal>" \
#     --notes "Render penuh film, 40 chunk paralel."
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Nama release GitHub yang SUDAH dibuat dulu dari luar (40 job upload zip chunk ke sini)"
        required: true
        type: string


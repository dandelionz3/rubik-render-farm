name: render-test

# Uji render 120 frame film Rubik Cat (4 job paralel x 30 frame).
# Dipicu manual dari tab Actions. Repo harus PUBLIK supaya menit Actions gratis.
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        segment: [1, 2, 3, 4]
    env:
      FS_SAMPLES: "8"
      FS_RAY: "0"
      FS_VOL: "1"
      FS_VOLTILE: "16"
      FS_DOF: "1"
      FS_MB: "1"
      FS_SUB: "1"
      FS_BEVEL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Mesa/EGL + DejaVu font
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libglx-mesa0 fonts-dejavu-core
          ldconfig -p | grep libEGL

      - name: Download Blender 4.5.3 LTS
        run: |
          curl -L -o blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz
          tar -xf blender.tar.xz
          ./blender-4.5.3-linux-x64/blender --version

      - name: Render 30 frames
        run: |
          START=$(( (${{ matrix.segment }} - 1) * 30 + 1 ))
          END=$(( ${{ matrix.segment }} * 30 ))
          echo "Segment ${{ matrix.segment }}: frames $START-$END"
          mkdir -p "$GITHUB_WORKSPACE/out"
          S=$(date +%s)
          # NOTE: keberhasilan dinilai dari FILE FRAME, bukan exit code Blender —
          # Mesa bisa segfault saat teardown SETELAH semua frame tersimpan.
          ./blender-4.5.3-linux-x64/blender -b --factory-startup \
            -P pipeline/animate_fast.py -- "$GITHUB_WORKSPACE/out" \
            --start $START --end $END --plan pipeline/plan.json \
            --toff 0 --res 960 540 --lensk 1.00 || echo "blender exited rc=$?"
          E=$(date +%s)
          N=$(ls "$GITHUB_WORKSPACE/out"/f_*.png 2>/dev/null | wc -l)
          echo "SEGMENT=${{ matrix.segment }} FRAMES=$N/30 SECS=$((E-S))" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$N" -lt 30 ]; then echo "FAIL: only $N/30 frames rendered"; exit 1; fi

      - name: Upload frames
        uses: actions/upload-artifact@v4
        with:
          name: frames-seg${{ matrix.segment }}
          path: out/f_*.png
          if-no-files-found: error
